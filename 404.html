<!doctype html>
<html lang="zh-CN">
<head>

<title>404 · 豆苗学堂</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#F8FCFF 0%,#E6F1FA 100%);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:#0F2A44}
  .code{font-size:clamp(72px,16vw,160px);font-weight:800;color:#0F2A44;line-height:1;letter-spacing:-4px}
  .sprout{font-size:clamp(48px,10vw,96px);margin:8px 0}
  h1{font-size:clamp(20px,4vw,28px);margin:8px 0 12px;font-weight:700}
  p{color:#5A7A96;font-size:15px;line-height:1.7;max-width:420px;text-align:center;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#0F2A44;color:#fff;
    text-decoration:none;padding:12px 24px;border-radius:999px;font-size:15px;font-weight:600;
    transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .foot{margin-top:40px;font-size:12.5px;color:#8FA8BC}
</style>
</head>
<body>
  <div class="code">404</div>
  <div class="sprout">🌱</div>
