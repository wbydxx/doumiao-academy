<script>
DM.boot({ root: "..", module: "terms" });
(function () {
  var DM = window.DM;

  document.querySelectorAll("[data-ic]").forEach(function (el) {
    el.insertAdjacentHTML("afterbegin", DM.icon(el.getAttribute("data-ic")));
  });

  DM.quiz({
    el: "#quiz",
    module: "terms",
    nextHref: "../achievements/index.html",
    data: [
      {
        q: "训练一个「判断邮件是不是垃圾邮件」的模型，每封邮件都由人工标注过「垃圾 / 正常」。这属于哪种学习范式？",
        opts: ["无监督学习", "监督学习", "强化学习"],
        a: 1,
        why: "带人工标注（标签）的数据 + 学习输入到输出的映射，正是监督学习的定义。无监督学习没有标签，强化学习靠奖励信号。",
        hint: "数据里每个样本都附带了「标准答案」吗？"
      },
      {
        q: "大语言模型（LLM）回答问题时，本质上在做什么？",
        opts: ["在联网数据库里检索现成答案", "逐个预测下一个 Token，直到句子完成", "播放训练时背下来的标准原文"],
        a: 1,
        why: "LLM 的核心任务就是「预测下一个 Token」。它不是检索，也不只会背原文——所以它能生成新句子，也会因此产生幻觉。",
        hint: "第 2 课你亲自当过一次 LLM，当时你在做什么？"
      },
      {
        q: "AI 眉飞色舞地介绍了一颗「豆苗星」，可它根本不存在。这种现象的术语是？",
        opts: ["过拟合（Overfitting）", "数据泄露（Data Leak）", "幻觉（Hallucination）"],
        a: 2,
        why: "貌似合理、实则编造的内容叫幻觉。根源是模型按概率补全文本，并没有「知道 / 不知道」的开关。",
        hint: "第 3 课的侦探游戏，你抓的就是它。"
      },
      {
        q: "想让 AI 写一段给初中生的科普短文，哪个提示词最可能得到高质量回答？",
        opts: ["写点东西", "帮我写一篇作文", "你是科普作家：写一段 150 字、面向初中生的短文解释什么是 Token，用一个生活类比"],
        a: 2,
        why: "好提示 = 角色（科普作家）+ 任务（解释 Token）+ 要求（150 字、面向初中生）+ 方法（用类比）。约束越明确，「下一个词」的选择范围越精准。",
        hint: "回想提示词公式：角色 + 任务 + 要求 + 示例。"
      }
    ]
  });
})();
</script>
