<script>
DM.boot({ root: "..", module: "lab" });
(function () {
  var DM = window.DM;

  document.querySelectorAll("[data-ic]").forEach(function (el) {
    el.insertAdjacentHTML("afterbegin", DM.icon(el.getAttribute("data-ic")));
  });

  DM.quiz({
    el: "#quiz",
    module: "lab",
    nextHref: "../achievements/index.html",
    data: [
      {
        q: "Python 里给变量赋值，正确的是？",
        opts: ["let x = 5", "x = 5", "x == 5"],
        a: 1,
        why: "Python 不需要 let、var 这些关键字，一个等号 = 就是赋值。x == 5 是在比较相等，不是赋值。",
        hint: "第 1 课说过：直接贴标签。"
      },
      {
        q: 'type("5") 的结果是？',
        opts: ["int（整数）", "str（文字）", "float（小数）"],
        a: 1,
        why: "带引号的就是文字（str）；不带引号的 5 才是整数（int）。类型不同，能做的事也不同。",
        hint: "回忆引号是谁的标志。"
      },
      {
        q: "range(1, 4) 依次产生哪些数？",
        opts: ["1、2、3", "1、2、3、4", "0、1、2、3"],
        a: 0,
        why: "range 数头不数尾：从 1 出发，到 4 之前停下，所以是 1、2、3 三个数。",
        hint: "第 3 课的跑道：终点线不撞线。"
      },
      {
        q: "函数里的 return 语句起什么作用？",
        opts: ["把结果返回给调用者，并立即结束函数", "只是打印结果，函数继续往下跑", "声明一个新变量"],
        a: 0,
        why: "return 双重职责：交回结果 + 终止函数。return 之后的代码不会执行；打印屏幕是 print() 的活，两者别搞混。",
        hint: "函数机器的「出料口」。"
      },
      {
        q: 'stations = ["下关", "玄武门"]，stations[0] 是？',
        opts: ['"下关"', '"玄武门"', "报错"],
        a: 0,
        why: "列表索引从 0 数：stations[0] 是第 1 个「下关」，stations[1] 才是「玄武门」。「第几个」和「索引几」永远差 1。",
        hint: "第 4 课的口诀：程序员从 0 开始数。"
      },
      {
        q: "列表的 append( ) 和 len( ) 分别是干嘛的？",
        opts: ["append 加一件到队尾，len 数出件数", "append 数件数，len 加一件", "两个都是删除"],
        a: 0,
        why: "append(x) 把 x 装到列表末尾；len(列表) 返回当前元素个数。一个负责「装」，一个负责「数」。",
        hint: "码头装货：一件装船，一件点数。"
      },
      {
        q: 'spots = {"中山陵": 0, "夫子庙": 30}，spots["夫子庙"] 取出什么？',
        opts: ["0", "30", '"夫子庙"'],
        a: 1,
        why: "字典按键取值：方括号里放键，取出来的是对应的值。「夫子庙」对应的值是 30。列表靠编号，字典靠键。",
        hint: "第 5 课的档案墙：贴标签的抽屉。"
      },
      {
        q: "n = 1，while n < 3 里打印 n 并每圈加 1，共打印几行？",
        opts: ["2 行：1、2", "3 行：1、2、3", "无限行"],
        a: 0,
        why: "n 从 1 起：1 < 3 打印 1 并加到 2；2 < 3 打印 2 并加到 3；3 < 3 不成立，循环停——3 本身不打印。",
        hint: "默念 while 三要素：起点、终点、每圈动。"
      },
      {
        q: "random.randint(1, 6) 能掷出哪些数？",
        opts: ["1 到 5（不含 6）", "1 到 6，两头都算", "0 到 6"],
        a: 1,
        why: "randint 两端都包含，相当于一颗真骰子。对比 range(1, 6) 数头不数尾——两者刚好相反，别记混。",
        hint: "第 6 课的江水盲盒。"
      }
    ]
  });
})();
</script>
