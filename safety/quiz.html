<script src="../assets/js/storage.js?v=4"></script><script src="../assets/js/mock-data.js?v=4"></script>

<script>
(function () {
  var DM = window.DM;
  DM.boot({ root: "..", module: "safety" });

  document.querySelectorAll("[data-icon]").forEach(function (el) {
    el.innerHTML = DM.icon(el.getAttribute("data-icon"));
  });
  document.querySelectorAll("[data-speak]").forEach(function (b) {
    b.addEventListener("click", function () { DM.speakPage(b); });
  });

  DM.quiz({
    el: "#quiz",
    module: "safety",
    nextHref: "../achievements/index.html",
    data: [
      { q: "网上有人要送你限定皮肤，只想知道你家住哪个小区。你会怎么做？",
        opts: ["告诉他大概位置，反正不说门牌号", "不告诉他，个人信息要保密，并告诉爸妈", "给他发一张小区的照片也没关系"],
        a: 1,
        why: "住址是小秘密，说出去可能带来危险，拿不准的事先告诉爸妈。",
        hint: "想想城门的钥匙，能随便给陌生人看吗？" },
      { q: "有人说只要你的账号密码，就帮你抽稀有装备。最该做的是？",
        opts: ["密码只告诉玩得最好的小伙伴", "把密码改短一点再给他", "不给任何人，并且马上告诉爸妈"],
        a: 2,
        why: "密码是你的城门钥匙，谁都不能给，给出去就守不住城门了。",
        hint: "钥匙能给陌生人吗？哪怕只给一半？" },
      { q: "认识一周的网友约你周末单独见面，怎么守城门？",
        opts: ["视频里聊过，可以去", "不去，把这件事马上告诉爸妈", "约在人多的商场里就没关系"],
        a: 1,
        why: "和网友见面一定要有家长陪同，单独赴约很危险。",
        hint: "屏幕那头的人，你看不到真实的样子。" },
      { q: "收到消息：“恭喜你中奖啦，点链接领取！”你会？",
        opts: ["马上点，晚了奖品就没了", "转发给同学，让大家帮忙看看", "不点击，先告诉爸妈和老师"],
        a: 2,
        why: "天上不会掉馅饼，陌生链接可能是陷阱。",
        hint: "真的奖品，需要你点陌生链接才能领吗？" },
      { q: "同学起哄，让你把别人的糗照发到群里。怎么做才对？",
        opts: ["不发，这是不尊重别人，并告诉老师", "发出去，反正是别人拍的", "只私发给好朋友一个人看"],
        a: 0,
        why: "随意传播别人的照片会伤害人，学会尊重和保护。",
        hint: "如果照片里的人是你，你愿意吗？" }
    ]
  });

  /* 测验引擎的"回到首页"链接指向模块目录，这里改回站点首页 */
  var q = document.getElementById("quiz");
  if (q && "MutationObserver" in window) {
    new MutationObserver(function () {
      q.querySelectorAll('a[href="index.html"]').forEach(function (a) {
        a.setAttribute("href", "../index.html");
      });
    }).observe(q, { childList: true, subtree: true });
  }
})();
</script>
